#                         ordinary English and this needs Cenay's call before it
#                         is forced. See the session desk, Q5.
#   Jake                — correct 22 times; the near-misses are make (1154),
#                         take (577), bake, wake, jack. Nothing safe to add.
#   Art / Arthur        — "Arthur" is transcribed correctly 97 times. "Art" is
#                         too short and too ordinary to correct safely.
#   TRFA                — correct 169 times. `trfaapi` and `trfapi` are NOT
#                         errors: trfaapi.com is a real, distinct project.
#   Blade / Notion /    — near-misses are all common English (claude, nothing,
#   Inertia / Eloquent    options, insert). Correct forms already dominate.
#   Realtop             — zero occurrences either way; nothing to learn yet.
