# Domain term normalization — "when you hear XXX, write YYY"
#
# Seeded 2026-08-12 from a frequency analysis of 83 cached raw transcripts in
# temp/transcribe-cache/ (27,014 utterances, ~3 MB). Counts in comments are the
# number of times that form actually appeared in real meetings — not guesses.
#
# HOW TO ADD A TERM
#   Add a string to `heard:`. That is the whole job. Do not classify it, do not
#   judge whether it is safe — scripts/terms.py decides that at load time.
#   From another repo, use:  /add-term Bookeo "book eoe"
#   (Was "book eeo" until 2026-08-13 — that example was REFUSED, because `eeo`
#   is in /usr/share/dict/words as the acronym and so every token read as
#   English. Same trap as `io`. "book eoe" is the variant actually listed below.)
#
# HOW THE CLASSIFIER DECIDES  (verified 2026-08-12, 19/19 cases)
#   A `heard:` variant is APPLIED if any of its tokens is not ordinary English.
#   It is REFUSED if every token is ordinary English, because replacing those
#   corrupts normal prose — "the book he mentioned" must not become
#   "the Bookeo mentioned". Tokens of 1-2 chars are checked against a stop-word
#   set; longer tokens against /usr/share/dict/words.
#
#   `force:` overrides that refusal for variants you personally vouch for.
#   Use it only where the phrase has no innocent meaning in these meetings.
#   Every forced substitution is logged loudly.

terms:

  # ---------------------------------------------------------------- Bookeo --
  # The term that started this. `bookio` is the dominant wrong token across the
  # archive (347), which contradicts the original single-meeting finding that
  # the engine "produces mush" rather than a consistent error.
  - correct: Bookeo
    heard:
      - bookio          # 347
      # NOT "bookio's" (14) — deliberately. The bare `bookio` rule already
      # rewrites it correctly to "Bookeo's"; listing the possessive separately
      # matches first (longest-first ordering) and SWALLOWS the "'s".
      # Regression-tested in tests/test_terms.py::test_possessive_preserved.
      - booko           #   9
      - booku           #   7
      - bookq           #   4
      - book io         # plan's original example
      - book eoe        # reported by Cenay
      - bukio  # 2026-08-13 Art meeting
      - buckio  # 2026-08-13 Art meeting
      - bookia  # 2026-08-18 Art meeting
      - buccio  # 2026-08-18 Art meeting
      - bookie o  # 2026-08-18 Art meeting
      - bookill  # 2026-08-19 Art meeting: 'Bookill's', 'Lookio'
      - lookio  # 2026-08-19 Art meeting: 'Bookill's', 'Lookio'
    identifier_prefix: bookeo_   # rewrites bookio_product_groups -> bookeo_product_groups
    # NOT listed, deliberately — all ordinary English, all legitimate in a
    # booking-software meeting: booking (259), booked (73), bookings (65),
    # book it (39), bookie (31), book here (29), book you (99).
    # Adding any of these would corrupt prose at scale.

  # --------------------------------------------------------------- Khurram --
  # "Khurram" appears ZERO times in 83 transcripts — the engine never gets it
  # right. `karam` is what it hears.
  - correct: Khurram
    heard:
      - karam           #  69
      - haram           #  37 — found 2026-08-12 by eyeballing preview output,
                        #      not by the fuzzy miner, which scored it too far
                        #      from "Khurram" to suggest. Confirmed from context:
                        #      "I had a meeting with Haram", "Haram has written
                        #      another API with me". One utterance even contains
                        #      "Haram and Karam" — the engine hearing the same
                        #      name two ways in a single sentence.
      - keram           #   1

  # ----------------------------------------------------------------- Cenay --
  # Also never transcribed correctly: zero correct occurrences in the archive.
  - correct: Cenay
    heard:
      - senay           #  13
      # NOT "senay's" (1) — same possessive-swallowing bug as Bookeo above.
      - cinay           #   1
      - cnay            #   1
      - cna             #   3
      - Sinead  # 2026-08-13 Art meeting
      - Sanay  # 2026-08-13 Art meeting
      - sineng  # 2026-08-18 Art meeting

  # ----------------------------------------------------------------- Milos --
  # Usually correct (104), but the Serbian pronunciation lands as "milosh".
  - correct: Milos
    heard:
      - milosh          #   7
      - miloshin        #   1
      - melos  # 2026-08-13 Art meeting

  # -------------------------------------------------------- ActiveCampaign --
  # Correct 232 times, but split into two words 61 times. Both tokens are
  # ordinary English, so the classifier refuses it by default — forced here
  # because "active campaign" has no innocent meaning in these meetings.
  - correct: ActiveCampaign
    heard:
      - active campaign     #  61
    force:
      - active campaign

  # ------------------------------------------------------------- fran-dash --
  # Never transcribed with the hyphen. "fran dash" is ordinary-English by token,
  # so it needs the same override.
  - correct: fran-dash
    heard:
      - fran dash       #  46
      - brandash        #   4
      - friendash       #   2
      - frontash        #   2
      - crandash        #   1
      - fran desh       #   1
      - frontache  # heard in the 2026-08-18 Khurram working session
      - front ache  # vouched by Cenay 2026-08-20; heard in the 2026-08-18 Khurram session
    force:
      - fran dash
      - front ache

  # -------------------------------------------------------------- Trainual --
  # Added 2026-08-13 via /add-term.
  - correct: Trainual
    heard:
      - tranual
      - tranul  # 2026-08-13 Art meeting
      - tranule  # 2026-08-13 Art meeting

  # ------------------------------------------------------------- Ninthroot --
  # Added 2026-08-13 via /add-term.
  - correct: Ninthroot
    heard:
      - ninth root
      - ninth route  # 6 manglings in the 2026-08-18 Art meeting alone
      - 9th route  # 6 manglings in the 2026-08-18 Art meeting alone
      - nine through  # 6 manglings in the 2026-08-18 Art meeting alone
      - knight through  # 6 manglings in the 2026-08-18 Art meeting alone
      - 9th grid  # 6 manglings in the 2026-08-18 Art meeting alone
    force:
      # `9th route` and `9th grid` were listed here too and removed 2026-08-20:
      # `9th` is not an ordinary English word, so the classifier already applies
      # them and forcing was redundant. `force:` is for variants the classifier
      # would otherwise REFUSE — a decorative entry fails tests/test_terms.py.
      - ninth root
      - ninth route
      - nine through
      - knight through

  # ------------------------------------------------------------------- FDD --
  # Added 2026-08-18 via /add-term.
  - correct: FDD
    heard:
      - ftd
      - ftds  # 2026-08-18 Art meeting — Franchise Disclosure Document

  # ----------------------------------------------------------------- cache --
  # Added 2026-08-18 via /add-term.
  - correct: cache
    heard:
      - cash
    force:
      - cash

  # ------------------------------------------------------------------- npm --
  # Added 2026-08-20 via /add-term.
  - correct: npm
    heard:
      - MPN

  # ---------------------------------------------------------------- Reverb --
  # Added 2026-08-20 via /add-term.
  - correct: Reverb
    heard:
      - laravel verb

